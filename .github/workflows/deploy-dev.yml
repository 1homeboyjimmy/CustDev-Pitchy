name: Deploy to Staging Server

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, dev-server]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Deploy
        run: |
          echo "==> Preparing Environment..."
          # Copy the .env file configured previously on the server to the current workspace
          if [ -f "/root/CustDev-Pitchy/.env" ]; then
            cp /root/CustDev-Pitchy/.env .env
            echo "    .env copied successfully."
          else
            echo "    WARNING: /root/CustDev-Pitchy/.env not found. Using .env.example."
            cp .env.example .env
          fi

          echo "==> Checking Polza configuration..."
          python3 - <<'PY'
          from pathlib import Path
          values = dict(line.split('=', 1) for line in Path('.env').read_text().splitlines()
                        if '=' in line and not line.lstrip().startswith('#'))
          if not values.get('POLZA_API_KEY', '').strip().strip('"').strip("'"):
              raise SystemExit('POLZA_API_KEY must be configured in /root/CustDev-Pitchy/.env')
          if values.get('POLZA_API_BASE', 'https://polza.ai/api/v1').rstrip('/') != 'https://polza.ai/api/v1':
              raise SystemExit('CustDev requires the Polza API endpoint')
          PY

          echo "==> Building containers (optimized)..."
          docker compose build

          echo "==> Stopping old containers to prevent name conflicts..."
          docker stop pitchy-offline pitchy-neo4j 2>/dev/null || true
          docker rm -f pitchy-offline pitchy-neo4j 2>/dev/null || true

          echo "==> Restarting services..."
          docker compose down --remove-orphans 2>/dev/null || true
          docker compose up -d

          echo "==> Waiting for services to initialize (15s)..."
          sleep 15

          echo "==> Container Status:"
          docker compose ps
          
          echo "==> Recent Logs (last 20 lines):"
          docker compose logs --tail=20

          echo "==> Cleaning up dangling images..."
          docker image prune -f

          echo "==> Deploy complete!"
