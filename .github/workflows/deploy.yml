name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e

            REPO_DIR="/root/MiroFish-Offline"
            # --- TEMPORARY: Get SSH Key for GitHub ---
            mkdir -p ~/.ssh
            if [ ! -f ~/.ssh/id_rsa ]; then
              ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa -N ""
            fi
            echo "==> YOUR SERVER PUBLIC KEY (Add this to GitHub Deploy Keys):"
            cat ~/.ssh/id_rsa.pub
            echo "=========================================================="
            # -----------------------------------------

            # Fix Host key verification failed
            ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts 2>/dev/null

            APP_DIR="$REPO_DIR/MiroFish-Custom"
            REMOTE_URL="git@github.com:1homeboyjimmy/CustDev-Pitchy.git"

            cd "$REPO_DIR"

            # Переключаем remote только если нужно
            CURRENT_REMOTE=$(git remote get-url origin 2>/dev/null || echo "")
            if [ "$CURRENT_REMOTE" != "$REMOTE_URL" ]; then
              echo "==> Switching remote to CustDev-Pitchy..."
              git remote set-url origin "$REMOTE_URL"
            fi

            echo "==> Pulling latest changes..."
            git fetch origin main
            git reset --hard origin/main

            cd "$APP_DIR"

            echo "==> Building containers (with cache)..."
            docker compose build

            echo "==> Restarting services..."
            docker compose up -d

            echo "==> Cleaning up dangling images..."
            docker image prune -f

            echo "==> Deploy complete!"
            docker compose ps
