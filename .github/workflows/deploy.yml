name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            REPO_DIR="/root/MiroFish-Offline"
            APP_DIR="$REPO_DIR/MiroFish-Custom"
            REMOTE_URL="git@github.com:1homeboyjimmy/CustDev-Pitchy.git"

            # Fix Host key verification failed
            mkdir -p ~/.ssh
            ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts 2>/dev/null

            # Если директория не является репозиторием, клонируем или инициализируем
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "==> Repository not found. Initializing..."
              mkdir -p "$REPO_DIR"
              cd "$REPO_DIR"
              git init
              git remote add origin "$REMOTE_URL"
            else
              cd "$REPO_DIR"
            fi

            # Переключаем remote только если нужно
            CURRENT_REMOTE=$(git remote get-url origin 2>/dev/null || echo "")
            if [ "$CURRENT_REMOTE" != "$REMOTE_URL" ]; then
              echo "==> Switching remote to CustDev-Pitchy..."
              git remote set-url origin "$REMOTE_URL"
            fi

            echo "==> Pulling latest changes..."
            git fetch origin main
            git reset --hard origin/main

            cd "$APP_DIR"

            # Убеждаемся, что .env существует (иначе docker-compose упадет)
            if [ ! -f .env ]; then
              echo "==> Warning: .env not found on server. Using .env.example as fallback..."
              cp .env.example .env
            fi

            echo "==> Building containers (optimized)..."
            docker compose build

            echo "==> Stopping old containers to prevent name conflicts..."
            docker stop pitchy-offline pitchy-neo4j 2>/dev/null || true
            docker rm -f pitchy-offline pitchy-neo4j 2>/dev/null || true

            echo "==> Restarting services..."
            docker compose down --remove-orphans 2>/dev/null || true
            docker compose up -d

            echo "==> Waiting for services to initialize (15s)..."
            sleep 15

            echo "==> Container Status:"
            docker compose ps
            
            echo "==> Recent Logs (last 20 lines):"
            docker compose logs --tail=20

            echo "==> Cleaning up dangling images..."
            docker image prune -f

            echo "==> Deploy complete!"
            docker compose ps
