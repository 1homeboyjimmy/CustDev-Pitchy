name: Verify deployed market research

on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-market-research.yml]
  workflow_dispatch:
    inputs:
      operation:
        description: Verify the deployed collector or inspect the deployment runner
        type: choice
        options: [verify, runner]
        default: verify
      full:
        description: Also run real Polza query planning and synthesis
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check production server over SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USERNAME: ${{ secrets.PROD_USERNAME }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          FULL_RESEARCH: ${{ inputs.full }}
          OPERATION: ${{ inputs.operation || 'runner' }}
        run: |
          set -euo pipefail
          deploy_key=$(mktemp)
          trap 'rm -f "$deploy_key"' EXIT
          printf '%s\n' "$PROD_SSH_KEY" > "$deploy_key"
          chmod 600 "$deploy_key"
          ssh -i "$deploy_key" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$PROD_USERNAME@$PROD_HOST" "bash -s -- '$OPERATION' '$FULL_RESEARCH'" <<'REMOTE'
          set -euo pipefail
          if [ "$1" = "runner" ]; then
            docker ps --format '{{.Names}} {{.Status}}'
            mapfile -t services < <(systemctl list-unit-files --no-legend 'actions.runner*' | awk '{print $1}')
            for service in "${services[@]}"; do
              printf 'Runner service: %s\n' "$service"
              systemctl show "$service" --property=ActiveState,SubState,ExecMainStatus
            done
            df -h /
            ps -eo comm,etime,pcpu,pmem --sort=-pcpu | head -n 12 || true
            # Browser installers run inside BuildKit; inspect only archive sizes,
            # never process environments, build secrets or application logs.
            for pid in $(pgrep -f '/playwright/driver/.*install' || true); do
              find "/proc/$pid/root/tmp" -maxdepth 2 -type f -name '*playwright*' \
                -printf '%f %s bytes\n' 2>/dev/null || true
            done
            timeout 45 python3 - <<'PY'
          from pathlib import Path
          import concurrent.futures
          import json
          import subprocess
          import time
          import urllib.request

          values = {}
          discovered = subprocess.run(['find', '/root', '/opt', '/srv', '-maxdepth', '4', '-type', 'f', '-name', '.env*'],
                                      capture_output=True, text=True, timeout=10).stdout.splitlines()
          for filename in dict.fromkeys(discovered + ['/opt/ai-startup/.env', '/opt/ai-startup/.env.runtime', '/root/CustDev-Pitchy/.env']):
              path = Path(filename)
              if path.exists():
                  settings = dict(line.split('=', 1) for line in path.read_text().splitlines()
                                  if '=' in line and not line.lstrip().startswith('#'))
                  keys = [key for key in settings if 'PROXY' in key and settings[key].strip().strip('\"\'')]
                  if keys:
                      print(json.dumps({'proxy_config_path': filename, 'keys': keys}), flush=True)
                  values.update({key: value for key, value in settings.items() if value.strip().strip('\"\'')})
          proxy = next((values.get(key, '').strip().strip('\"\'') for key in
                        ('SIGNAL_HTTPS_PROXY', 'SEARCH_HTTPS_PROXY', 'EXA_HTTPS_PROXY')
                        if values.get(key, '').strip().strip('\"\'')), '')
          url = 'https://cdn.playwright.dev/builds/cft/156.0.8078.4/linux64/chrome-headless-shell-linux64.zip'
          def probe(mode):
              started = time.monotonic()
              try:
                  handler = urllib.request.ProxyHandler({'http': proxy, 'https': proxy} if mode == 'proxy' else {})
                  opener = urllib.request.build_opener(handler)
                  request = urllib.request.Request(url, headers={'Range': 'bytes=0-262143'})
                  with opener.open(request, timeout=15) as response:
                      data = response.read(262144)
                      return {'download_probe': mode, 'http_status': response.status, 'bytes': len(data),
                              'seconds': round(time.monotonic() - started, 2)}
              except Exception as exc:
                  return {'download_probe': mode, 'error_type': type(exc).__name__,
                          'seconds': round(time.monotonic() - started, 2)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              for result in pool.map(probe, ['direct', 'proxy'] if proxy else ['direct']):
                  print(json.dumps(result), flush=True)
          PY
            exit 0
          fi
          args=()
          if [ "$2" = "true" ]; then args+=(--full); fi
          docker exec pitchy-offline python backend/scripts/check_market_research.py "${args[@]}"
          REMOTE
