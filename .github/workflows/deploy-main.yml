name: Deploy to Production Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, prod-server]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Deploy
        run: |
          echo "==> Preparing Environment..."
          # Copy the .env file configured previously on the server to the current workspace
          if [ -f "/root/CustDev-Pitchy/.env" ]; then
            cp /root/CustDev-Pitchy/.env .env
            echo "    .env copied successfully."
          else
            echo "    WARNING: /root/CustDev-Pitchy/.env not found. Using .env.example."
            cp .env.example .env
          fi

          # The main Pitchy site signs the shared `access_token` cookie with
          # its APP_SECRET_KEY and scopes it to .pitchy.pro. Keep CustDev on
          # the same key; otherwise the browser sends the cookie to this
          # subdomain but Flask rejects it and the SPA redirects to /login.
          # Read only this one setting from the main site's server env — never
          # copy the whole file or print the secret into workflow logs.
          if [ -f "/opt/ai-startup/.env" ]; then
            MAIN_APP_SECRET="$(sed -n 's/^APP_SECRET_KEY=//p' /opt/ai-startup/.env | head -n 1)"
            if [ -n "$MAIN_APP_SECRET" ]; then
              sed -i '/^APP_SECRET_KEY=/d' .env
              printf 'APP_SECRET_KEY=%s\n' "$MAIN_APP_SECRET" >> .env
              echo "    Shared APP_SECRET_KEY synchronized from main Pitchy."
            else
              echo "    WARNING: APP_SECRET_KEY not found in /opt/ai-startup/.env."
            fi
          else
            echo "    WARNING: /opt/ai-startup/.env not found; using CustDev APP_SECRET_KEY."
          fi

          echo "==> Building containers (optimized)..."
          docker compose build

          echo "==> Fixing Nginx configuration if needed..."
          if [ -f "/etc/nginx/sites-available/custdev" ]; then
            sudo sed -i 's/proxy_pass http:\/\/127.0.0.1:5001\/;/proxy_pass http:\/\/127.0.0.1:5001;/' /etc/nginx/sites-available/custdev
            sudo nginx -t && sudo systemctl reload nginx || true
            echo "    Nginx fixed and reloaded."
          fi

          echo "==> Stopping old containers to prevent name conflicts..."
          docker stop pitchy-offline pitchy-neo4j 2>/dev/null || true
          docker rm -f pitchy-offline pitchy-neo4j 2>/dev/null || true

          echo "==> Restarting services..."
          docker compose down --remove-orphans 2>/dev/null || true
          docker compose up -d

          echo "==> Waiting for services to initialize (15s)..."
          sleep 15

          echo "==> Container Status:"
          docker compose ps
          
          echo "==> Recent Logs (last 20 lines):"
          docker compose logs --tail=20

          echo "==> Cleaning up dangling images..."
          docker image prune -f

          echo "==> Deploy complete!"
