name: Deploy to Production Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, prod-server]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Deploy
        run: |
          echo "==> Preparing Environment..."
          # Copy the .env file configured previously on the server to the current workspace
          if [ -f "/root/CustDev-Pitchy/.env" ]; then
            cp /root/CustDev-Pitchy/.env .env
            echo "    .env copied successfully."
          else
            echo "    WARNING: /root/CustDev-Pitchy/.env not found. Using .env.example."
            cp .env.example .env
          fi

          # The SSO HMAC secret is resolved by the main Pitchy deployment
          # into its effective runtime env. Copy only this setting; never copy
          # the main site's APP_SECRET_KEY or the whole env file.
          if [ -f "/opt/ai-startup/.env.runtime" ]; then
            export CUSTDEV_SSO_SERVICE_SECRET="$(sed -n 's/^CUSTDEV_SSO_SERVICE_SECRET=//p' /opt/ai-startup/.env.runtime | tail -n 1)"
            if [ -n "$CUSTDEV_SSO_SERVICE_SECRET" ]; then
              python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('.env')
          secret = os.environ['CUSTDEV_SSO_SERVICE_SECRET']
          lines = path.read_text(encoding='utf-8').splitlines()
          lines = [line for line in lines if not line.startswith('CUSTDEV_SSO_SERVICE_SECRET=')]
          lines.append(f'CUSTDEV_SSO_SERVICE_SECRET={secret}')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
              echo "    CustDev SSO service secret synchronized."
            fi
          fi
          unset CUSTDEV_SSO_SERVICE_SECRET

          # Passport import and market RAG must use the same service token as
          # the main Pitchy runtime. Keep it out of Git and synchronize it on
          # every deploy so a stale CustDev .env cannot silently break imports.
          if [ -f "/opt/ai-startup/.env.runtime" ]; then
            export PITCHY_RAG_API_KEY="$(sed -n 's/^RAG_API_KEY=//p' /opt/ai-startup/.env.runtime | tail -n 1)"
            if [ -n "$PITCHY_RAG_API_KEY" ]; then
              python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('.env')
          values = {
              'RAG_API_KEY': os.environ['PITCHY_RAG_API_KEY'],
              'MAIN_SERVER_RAG_URL': 'https://pitchy.pro/api/rag/search',
          }
          lines = path.read_text(encoding='utf-8').splitlines()
          lines = [line for line in lines if line.split('=', 1)[0] not in values]
          lines.extend(f'{key}={value}' for key, value in values.items())
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
              echo "    Pitchy passport/RAG credentials synchronized."
            else
              echo "    WARNING: RAG_API_KEY missing in main Pitchy runtime; passport import will be unavailable."
            fi
          fi
          unset PITCHY_RAG_API_KEY

          # The runtime file is optional when the dedicated secrets were
          # already provisioned in CustDev's persistent server env. Until the
          # two SSO secrets are provisioned, keep the explicitly approved
          # legacy validation through the main Pitchy /me endpoint.
          if grep -Eq '^CUSTDEV_SSO_SERVICE_SECRET=.{32,}$' .env \
            && grep -Eq '^CUSTDEV_SESSION_SECRET=.{32,}$' .env; then
            echo "    CustDev SSO configuration is ready."
          else
            sed -i '/^CUSTDEV_SSO_MODE=/d' .env
            printf 'CUSTDEV_SSO_MODE=legacy\n' >> .env
            echo "    WARNING: SSO secrets unavailable; using approved legacy auth mode."
          fi
          chmod 600 .env

          echo "==> Building containers (optimized)..."
          docker compose build

          echo "==> Preparing durable uploads storage..."
          docker volume create pitchy-custdev-uploads >/dev/null
          mkdir -p backend/uploads
          # One-way, non-overwriting migration from the legacy runner bind
          # mount. On later deploys the named volume remains authoritative.
          docker run --rm --entrypoint sh \
            -v "$PWD/backend/uploads:/legacy:ro" \
            -v pitchy-custdev-uploads:/data \
            custdev-pitchy-pitchy:latest \
            -c 'cp -an /legacy/. /data/ 2>/dev/null || true; mkdir -p /data/projects /data/simulations /data/reports'

          echo "==> Fixing Nginx configuration if needed..."
          if [ -f "/etc/nginx/sites-available/custdev" ]; then
            sudo sed -i 's/proxy_pass http:\/\/127.0.0.1:5001\/;/proxy_pass http:\/\/127.0.0.1:5001;/' /etc/nginx/sites-available/custdev
            sudo nginx -t && sudo systemctl reload nginx || true
            echo "    Nginx fixed and reloaded."
          fi

          echo "==> Stopping old containers to prevent name conflicts..."
          docker stop pitchy-offline pitchy-neo4j 2>/dev/null || true
          docker rm -f pitchy-offline pitchy-neo4j 2>/dev/null || true

          echo "==> Restarting services..."
          docker compose down --remove-orphans 2>/dev/null || true
          docker compose up -d

          echo "==> Waiting for services to initialize (15s)..."
          sleep 15

          echo "==> Verifying Pitchy passport bridge..."
          docker compose exec -T pitchy python -c "import os,requests; r=requests.get('https://pitchy.pro/api/rag/projects',params={'user_id':0},headers={'Authorization':'Bearer '+os.environ['RAG_API_KEY']},timeout=15); print('passport bridge status:',r.status_code); r.raise_for_status()"

          echo "==> Container Status:"
          docker compose ps

          echo "==> Verifying durable uploads storage..."
          docker compose exec -T pitchy test -d /app/backend/uploads/projects
          docker compose exec -T pitchy test -d /app/backend/uploads/simulations
          
          echo "==> Recent Logs (last 20 lines):"
          docker compose logs --tail=20

          echo "==> Cleaning up dangling images..."
          docker image prune -f

          echo "==> Deploy complete!"
