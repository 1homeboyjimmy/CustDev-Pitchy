services:
  pitchy:
    build: .
    container_name: pitchy-offline
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      # Runtime projects, tasks and reports must survive Actions checkout.
      # A bind mount inside the runner worktree was cleaned between deploys.
      - custdev_uploads:/app/backend/uploads
    depends_on:
      - neo4j
    # Ограничиваем ресурсы, чтобы сервер не зависал
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

  neo4j:
    image: neo4j:5.18-community
    container_name: pitchy-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-pitchy}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    # Лимиты для базы данных
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  custdev_uploads:
    name: pitchy-custdev-uploads
  neo4j_data:
  neo4j_logs:
